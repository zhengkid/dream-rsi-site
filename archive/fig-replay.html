        <span class="fnum">Interactive</span>
        <b>One run, four policies, one bill.</b> The first act is the only one that
        costs anything: the deployed policy &pi;&#8304; refines three branches in lock step
        and spends <b>14 discovery-agent calls</b>, and each node keeps the score it
        earned. After that the tree is frozen and becomes the simulator. A candidate
        policy never sees the tree &mdash; it sees the eligible set
        $\mathcal{A}(\mathcal{T}) = \{r\} \cup \{\text{leaves}\}$ and the scores handed
        back so far, and answers with one <span class="step">CONTINUE</span>. Every
        answer is already on disk, so a full evaluation costs <b>zero</b> executions.
        The four candidates walk the same fourteen nodes in four different orders and
        get four different curves: greedy cannot let go of branch&nbsp;A, which looks
        best for five attempts and then dies at .47; explore-then-exploit pays for
        &pi;&#8304;&rsquo;s ordering mistake twice over; &pi;&sup3; drops a branch as soon as a wave
        stops paying and reaches the same 0.86 in <b>10 continues instead of 13</b>.
        That comparison is what gets shipped &mdash; and because &pi;&#8304; is itself
        a candidate, it can only ever be beaten, never undercut.
